<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulários</title>
</head>

<body>
    <h1>Formulários</h1>
    <!-- form a tag principal de um formulário-->
    <form action="">
        <!-- label Identificador de campo-->
        <label for="">Nome</label>
        <!-- input entrada de dados-->
        <input placeholder="ex:João Gomes" type="text">
        <br>
        <label for="">Data de Nascimento</label>
        <input type="date" name="" id="">
        <br>
        <h2>Frutas</h2>
        <input type="checkbox" name="" id "">
        <label for="">Manga</label>
        <input type="checkbox" name="" id "">
        <label for="">Uva</label>
        <input type="checkbox" name="" id "">
        <label for="">Pessêgo</label>

        <h2>Tipo Açaí</h2>

        <input type="radio" name="tipo" id "">
        <label for="">300 ml</label>
        <input type="radio" name="tipo" id "">
        <label for="">500 ml</label>
        <input type="radio" name="tipo" id "">
        <label for="">700 ml</label>
        <br>
        <label for="">Cor</label>
        <input type="color" name="" id="">
        <br>
        <label for="">Envie sua foto</label>
        <input type="file" name="" id="">
        <br>
        <h2>Estado</h2>
        <select name="" id="">
            <option value="">Espirito Santo</option>
            <option value=""> Rio de Janeiro</option>
            <option value="">São paulo</option>
        </select>
        <br>
        <button>Enviar</button>
        <br>
        <label for="">Senha</label>
        <input type="password" name="" id="">
        <br>
        <input type="submit" value="Cadastrar">
    </form>
    <a href="./"><img src="btn_voltar3.png" alt="voltar" width="50px"></a>
</body>

</html>
