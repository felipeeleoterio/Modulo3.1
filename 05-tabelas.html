<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <table border="1px">
        <!-- caption representa o conteúdo da tabela -->
        <caption> Nomes de alunos</caption>
        <!-- thead é o cabeçalho -->
        <thead>
            <!-- tr representa linha -->
            <tr>
                <!-- th representa titulo (deixa)-->
                <th>Nomes</th>
                <th>Idades</th>
                <th colspan="2"></th>
            </tr>
        </thead>
        <!-- tbody representa o corpo da tabela ou seja os elementos contidos-->
        <tbody>
            <tr>
                <!-- td são células comuns da tabela-->
                <td>cr7</td>
                <td>18</td>
            </tr>
            <tr>
                <td>Messi</td>
                <td>19</td>
            </tr>
        </tbody>
        <tfoot>
            <td>Total</td>
            <td>2</td>
        </tfoot>
    </table>
    <a href="./"><img src="btn_voltar3.png" alt="voltar" width="50px"></a>
</body>

</html>
